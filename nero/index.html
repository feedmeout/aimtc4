<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Οι τρεις καταστάσεις του νερού</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script>
    // Όταν πατάτε ένα αντικείμενο, εμφανίζεται η εξήγησή του στον πίνακα πληροφοριών.
    AFRAME.registerComponent('show-info', {
      schema: {text: {type: 'string'}},
      init: function () {
        this.el.addEventListener('click', () => {
          const panel = document.querySelector('#info');
          document.querySelector('#info-text').setAttribute('value', this.data.text);
          panel.setAttribute('visible', true);
        });
      }
    });
  </script>
</head>
<body>
  <!-- AIMTC4, Εργαστήριο 6: υπόδειγμα τεχνουργήματος για το ΣΑΕ 6 (A-Frame 1.8.0).
       Δίπλα στο index.html: greek-sdf.json, greek-sdf.png, LICENSE-DejaVu.txt. -->
  <a-scene xr-mode-ui="XRMode: xr" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10"></a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10"></a-entity>

    <a-sky color="#DDEBF7" hide-on-enter-ar></a-sky>
    <a-plane rotation="-90 0 0" width="10" height="10" color="#E8E2D0" hide-on-enter-ar></a-plane>

    <a-text value="Οι τρεις καταστάσεις του νερού" font="greek-sdf.json" font-image="greek-sdf.png"
            align="center" width="5" color="#1F3864" position="0 2.45 -3.2"></a-text>
    <a-text value="Πατήστε ένα αντικείμενο" font="greek-sdf.json" font-image="greek-sdf.png"
            align="center" width="2.6" color="#4A5A78" position="0 2.15 -3.2"></a-text>

    <!-- Στερεή κατάσταση -->
    <a-box class="clickable" position="-1.3 1.45 -3.2" width="0.5" height="0.5" depth="0.5" color="#A9D6F5" opacity="0.85"
           animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
           show-info="text: Πάγος, στερεή κατάσταση. Όταν θερμαίνεται, λιώνει στους 0 °C και γίνεται νερό: τήξη."></a-box>
    <a-text value="Πάγος" font="greek-sdf.json" font-image="greek-sdf.png" align="center" width="3" color="#222222" position="-1.3 1.0 -3.2"></a-text>

    <!-- Υγρή κατάσταση -->
    <a-sphere class="clickable" position="0 1.45 -3.2" radius="0.3" color="#2E86C1"
              animation__bob="property: position; from: 0 1.45 -3.2; to: 0 1.53 -3.2; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine"
              animation__wobble="property: scale; from: 1 1 1; to: 1.06 0.94 1.06; dir: alternate; loop: true; dur: 800; easing: easeInOutSine"
              show-info="text: Νερό, υγρή κατάσταση. Εξατμίζεται και γίνεται υδρατμοί: εξάτμιση. Όταν ψύχεται στους 0 °C, πήζει και γίνεται πάγος: πήξη."></a-sphere>
    <a-text value="Νερό" font="greek-sdf.json" font-image="greek-sdf.png" align="center" width="3" color="#222222" position="0 1.0 -3.2"></a-text>

    <!-- Αέρια κατάσταση: οι υδρατμοί δεν φαίνονται, οι μικρές σφαίρες είναι σύμβολο και ανεβαίνουν σαν ατμός -->
    <a-entity class="clickable" position="1.3 1.45 -3.2" geometry="primitive: box; width: 0.6; height: 0.55; depth: 0.4" material="visible: false"
              show-info="text: Υδρατμοί, αέρια κατάσταση. Όταν ψύχονται, γίνονται ξανά νερό: υγροποίηση.">
      <a-sphere radius="0.07" position="-0.2 -0.12 0" color="#FFFFFF" opacity="0.65"
                animation__rise="property: position; from: -0.2 -0.12 0; to: -0.2 0.18 0; loop: true; dur: 3000; delay: 0; easing: linear"
                animation__fade="property: material.opacity; from: 0.65; to: 0; loop: true; dur: 3000; delay: 0; easing: easeInQuad"></a-sphere>
      <a-sphere radius="0.06" position="-0.05 0.15 0.05" color="#FFFFFF" opacity="0.65"
                animation__rise="property: position; from: -0.05 0.15 0.05; to: -0.05 0.45 0.05; loop: true; dur: 3000; delay: 500; easing: linear"
                animation__fade="property: material.opacity; from: 0.65; to: 0; loop: true; dur: 3000; delay: 500; easing: easeInQuad"></a-sphere>
      <a-sphere radius="0.08" position="0.13 -0.04 -0.05" color="#FFFFFF" opacity="0.65"
                animation__rise="property: position; from: 0.13 -0.04 -0.05; to: 0.13 0.26 -0.05; loop: true; dur: 3000; delay: 1000; easing: linear"
                animation__fade="property: material.opacity; from: 0.65; to: 0; loop: true; dur: 3000; delay: 1000; easing: easeInQuad"></a-sphere>
      <a-sphere radius="0.06" position="0.23 0.17 0" color="#FFFFFF" opacity="0.65"
                animation__rise="property: position; from: 0.23 0.17 0; to: 0.23 0.47 0; loop: true; dur: 3000; delay: 1500; easing: linear"
                animation__fade="property: material.opacity; from: 0.65; to: 0; loop: true; dur: 3000; delay: 1500; easing: easeInQuad"></a-sphere>
      <a-sphere radius="0.07" position="-0.15 0.04 -0.08" color="#FFFFFF" opacity="0.65"
                animation__rise="property: position; from: -0.15 0.04 -0.08; to: -0.15 0.34 -0.08; loop: true; dur: 3000; delay: 2000; easing: linear"
                animation__fade="property: material.opacity; from: 0.65; to: 0; loop: true; dur: 3000; delay: 2000; easing: easeInQuad"></a-sphere>
      <a-sphere radius="0.06" position="0.05 -0.2 0.06" color="#FFFFFF" opacity="0.65"
                animation__rise="property: position; from: 0.05 -0.2 0.06; to: 0.05 0.1 0.06; loop: true; dur: 3000; delay: 2500; easing: linear"
                animation__fade="property: material.opacity; from: 0.65; to: 0; loop: true; dur: 3000; delay: 2500; easing: easeInQuad"></a-sphere>
    </a-entity>
    <a-text value="Υδρατμοί" font="greek-sdf.json" font-image="greek-sdf.png" align="center" width="3" color="#222222" position="1.3 1.0 -3.2"></a-text>

    <!-- Οι αλλαγές κατάστασης -->
    <a-text value="τήξη →" font="greek-sdf.json" font-image="greek-sdf.png" align="center" width="2.6" color="#B5521B" position="-0.65 1.68 -3.2"></a-text>
    <a-text value="← πήξη" font="greek-sdf.json" font-image="greek-sdf.png" align="center" width="2.6" color="#1F5F8B" position="-0.65 1.22 -3.2"></a-text>
    <a-text value="εξάτμιση →" font="greek-sdf.json" font-image="greek-sdf.png" align="center" width="2.6" color="#B5521B" position="0.65 1.68 -3.2"></a-text>
    <a-text value="← υγροποίηση" font="greek-sdf.json" font-image="greek-sdf.png" align="center" width="2.6" color="#1F5F8B" position="0.65 1.22 -3.2"></a-text>

    <!-- Πίνακας πληροφοριών -->
    <a-entity id="info" position="0 0.55 -2.6" rotation="-15 0 0" visible="false">
      <a-plane width="2.7" height="0.62" color="#FFFFFF" opacity="0.92"></a-plane>
      <a-text id="info-text" value="" font="greek-sdf.json" font-image="greek-sdf.png" align="center" width="2.5"
              wrap-count="44" color="#1F2A44" position="0 0 0.01"></a-text>
    </a-entity>
  </a-scene>
</body>
</html>
